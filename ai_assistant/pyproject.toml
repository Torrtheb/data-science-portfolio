[project]
name = "aieng-3"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosmtplib>=4.0.2",
    "alembic>=1.16.5",
    "fastapi>=0.116.1",
    "langchain>=0.3.27",
    "langchain-openai>=0.3.33",
    "langgraph[postgres]>=0.6.7,<0.7",
    "langgraph-checkpoint-postgres>=2.0.23",
    "psycopg[binary]>=3.2.10",
    "pydantic[email]>=2.11.7",
    "pytest>=8.4.2",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.1.1",
    "python-jose>=3.5.0",
    "sqlalchemy>=2.0.43",
    "sse-starlette>=3.0.2",
    "tenacity>=9.1.2",
    "trustcall>=0.0.39",
    "uvicorn[standard]>=0.35.0",
    "langchain-anthropic>=0.3.20",
    "langchain-google-genai>=2.1.12",
    "langchain-postgres>=0.0.15",
    "langsmith>=0.1.76",
    "bcrypt>=5.0.0",
    "mypy>=1.18.2",
    "gcloud>=0.18.3",
    "redis>=5.0.7",
]

[project.optional-dependencies]
security = [
    "bandit>=1.7.9",
]

[tool.ruff]
line-length = 100
extend-exclude = ["backend/tests/*"]

[tool.ruff.lint]
ignore = ["E402"]

[tool.pytest.ini_options]
testpaths = [
  "tests",
  "backend/tests",
  ".",
]
addopts = "-q"
